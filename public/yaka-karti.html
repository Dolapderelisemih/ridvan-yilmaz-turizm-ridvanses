<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06231b" />
  <link rel="icon" type="image/png" href="/icons/icon-512.png?v=81" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=81" />
  <link rel="manifest" href="/manifest.json?v=81" />
  <title>Baskıya Hazır Hacı Yaka Kartı & QR Kod | Rıdvan Yılmaz Turizm</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://ses.ridvanyilmazturizm.com/yaka-karti" />
  <link rel="stylesheet" href="/css/style.css?v=81" />
  <script>
    (function() {
      const savedToken = (localStorage.getItem('ry_auth_token') || '').trim();
      const hasCookie = document.cookie.split(';').some((c) => c.trim().startsWith('ry_auth='));
      if (!hasCookie && !savedToken) {
        window.location.replace('/login?next=' + encodeURIComponent(window.location.pathname + window.location.search));
      } else if (!hasCookie && savedToken) {
        const secureFlag = window.location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = 'ry_auth=' + encodeURIComponent(savedToken) + '; path=/; max-age=2592000; SameSite=Lax' + secureFlag;
      }
    })();
  </script>
  <script src="/vercel-ws-shim.js?v=81"></script>
  <style>
    .print-toolbar {
      background: linear-gradient(155deg, #06231B 0%, #093529 100%);
      color: #FFFFFF;
      padding: 16px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--color-gold);
    }
    .badges-sheet {
      max-width: 920px;
      margin: 28px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .neck-badge {
      background: #FFFFFF;
      border: 2px solid var(--color-emerald-deep);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .badge-top {
      background: linear-gradient(150deg, #06231B 0%, #0B4636 100%) !important;
      color: #FFFFFF !important;
      padding: 20px 22px 18px;
      text-align: center;
      border-bottom: 3px solid var(--color-gold);
      position: relative;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .lanyard-slot {
      width: 58px;
      height: 10px;
      border-radius: 99px;
      background: var(--color-ground);
      border: 1.5px solid var(--color-gold);
      margin: 0 auto 12px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .badge-body {
      padding: 22px;
      text-align: center;
    }
    .qr-box {
      width: 172px;
      height: 172px;
      margin: 14px auto;
      padding: 10px;
      border: 1.5px solid rgba(197, 160, 89, 0.55);
      border-radius: 18px;
      background: #FFFFFF;
      box-shadow: 0 8px 22px rgba(6, 35, 27, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .badge-footer {
      background: var(--color-ground);
      border-top: 1px solid var(--color-hairline);
      padding: 12px 16px;
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      text-align: center;
      color: var(--color-emerald-night);
      font-weight: 800;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    @media print {
      .print-toolbar,
      .bulk-panel,
      .badge-qr-warning {
        display: none !important;
      }
      body,
      .neck-badge,
      .badge-top,
      .lanyard-slot,
      .badge-footer,
      .badge {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background: #FFFFFF !important;
        line-height: 1.2 !important;
      }
      .badges-sheet {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
      }
      .neck-badge {
        border-radius: 12px !important;
        line-height: 1.2 !important;
      }
      .badge-top {
        padding: 6px 10px 5px !important;
        border-bottom-width: 2px !important;
      }
      .lanyard-slot {
        width: 48px !important;
        height: 6px !important;
        margin: 0 auto 3px !important;
      }
      .badge-brand-kicker {
        font-size: 0.62rem !important;
        line-height: 1.15 !important;
      }
      .badge-tour-title {
        font-size: 0.92rem !important;
        line-height: 1.18 !important;
        margin-top: 2px !important;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badge-body {
        padding: 6px 10px !important;
      }
      .badge-role-kicker {
        font-size: 0.62rem !important;
        line-height: 1.15 !important;
      }
      .badge-pilgrim-name {
        font-size: 1rem !important;
        line-height: 1.18 !important;
        margin: 2px 0 4px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge-code-pill {
        font-size: 0.68rem !important;
        padding: 2px 8px !important;
      }
      .qr-box {
        width: 112px !important;
        height: 112px !important;
        margin: 4px auto !important;
        padding: 4px !important;
        border-radius: 10px !important;
      }
      .badge-qr-desc {
        font-size: 0.66rem !important;
        line-height: 1.2 !important;
        margin: 0 auto 5px !important;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badge-meta-box {
        padding: 5px 8px !important;
        font-size: 0.65rem !important;
        gap: 1px !important;
        line-height: 1.18 !important;
        border-radius: 8px !important;
      }
      .badge-meta-box > div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge-footer {
        padding: 5px 8px !important;
        font-size: 0.66rem !important;
        line-height: 1.15 !important;
      }
    }
    .bulk-panel {
      max-width: 920px;
      margin: 18px auto 0;
      padding: 0 16px;
    }
    .bulk-card {
      background: #FFFFFF;
      border: 1.5px solid var(--color-gold);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: var(--shadow-soft);
    }
    @media screen and (max-width: 720px) {
      .badges-sheet {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="star-field">

  <div class="print-toolbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1 style="font-size:1rem; margin:0; font-weight:800; color:#FFFFFF; font-family:var(--font-sans);">
        Rıdvan Yılmaz Turizm — Hacı Yaka Kartı & Canlı Ses QR Kod Üretici
      </h1>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <select id="tourCodePicker" class="select" style="width:auto; padding:8px 12px; font-size:0.85rem;" onchange="onBadgeTourChange()">
        <option value="RY-KASIM">RY-KASIM (13-14 Kasım Umresi • Ömer Ali Gültekin)</option>
      </select>
      <select id="badgeRoomPicker" class="select" style="width:auto; padding:8px 12px; font-size:0.85rem;" onchange="updateBadges()">
        <option value="genel">Genel Rehberlik Odası</option>
        <option value="siyer">Siyer / Tavaf Özel Odası</option>
      </select>
      <input type="text" id="customPilgrimInput" class="input" style="width:200px; padding:8px 12px; font-size:0.85rem;" placeholder="Tek İsim (Hızlı)" oninput="debouncedUpdateBadges()" />
      <button type="button" class="btn btn-outline btn-sm" style="color:#E2C785; border-color:rgba(226,199,133,0.5); background:rgba(197,160,89,0.12);" onclick="toggleBulkListPanel()">
        📋 Toplu Hacı İsim Listesi Yapıştır (<span id="badgeCountLabel">4</span> Kart)
      </button>
      <button class="btn btn-gold btn-sm" onclick="printBadgesNow()">A4 Yaka Kartlarını Yazdır / PDF Kaydet</button>
      <a href="/panel" class="btn btn-outline btn-sm" style="color:#FFFFFF; border-color:rgba(255,255,255,0.3); background:transparent;">← Panele Dön</a>
    </div>
  </div>

  <!-- TOPLU HACI İSİM LİSTESİ YAPIŞTIRMA PANELİ (BASKIDA GİZLENİR) -->
  <div id="bulkListPanel" class="bulk-panel" style="display:none;">
    <div class="bulk-card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
        <div>
          <strong style="color:var(--color-emerald-night); font-size:0.98rem;">📋 Toplu Hacı İsim Listesi (Excel veya WhatsApp'tan Yapıştırın)</strong>
          <div style="font-size:0.8rem; color:var(--color-muted); margin-top:2px;">
            Her satıra 1 hacı ismi gelecek şekilde 40–100 kişilik kafile listesini alt alta yapıştırın; her misafir için isme özel A4 yaka kartı otomatik üretilir.
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="clearBulkList()">Listeyi Temizle</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="updateBadges()">Kartları Oluştur</button>
        </div>
      </div>
      <textarea id="bulkPilgrimsTextarea" rows="6" class="textarea" placeholder="Örn:&#10;Hacı Mustafa Kaya&#10;Hacı Fatma Yıldırım&#10;Hacı Ahmet Demir&#10;Hacı Ayşe Çelik..." oninput="debouncedUpdateBadges()"></textarea>
    </div>
  </div>

  <div id="badgeQrWarningBanner" class="badge-qr-warning" style="display:none; max-width:920px; margin:16px auto 0; padding:12px 16px; border-radius:12px; background:#fffbeb; border:1.5px solid #f59e0b; color:#92400e; font-size:0.84rem; font-weight:700;"></div>

  <div class="badges-sheet" id="badgesContainer"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialBadgeRoom = (params.get('room') || 'genel').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'genel';
    const roomSel = document.getElementById('badgeRoomPicker');
    if (roomSel) {
      if (!Array.from(roomSel.options).some((o) => o.value === initialBadgeRoom)) {
        const opt = document.createElement('option');
        opt.value = initialBadgeRoom;
        opt.textContent = `Özel Oda (${initialBadgeRoom})`;
        roomSel.appendChild(opt);
      }
      roomSel.value = initialBadgeRoom;
    }
    if (params.get('code')) {
      const sel = document.getElementById('tourCodePicker');
      const code = params.get('code').toUpperCase();
      if (!Array.from(sel.options).some((o) => o.value === code)) {
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = code;
        sel.appendChild(opt);
      }
      sel.value = code;
    }
    if (params.get('name')) {
      document.getElementById('customPilgrimInput').value = params.get('name');
    }

    let toursData = [];
    let agencyPhone = '+90 538 399 96 66';
    let bootstrapFailed = false;
    window.__genericBadgeQr = '';

    function showBadgeWarning(msg) {
      const box = document.getElementById('badgeQrWarningBanner');
      if (!box) return;
      if (!msg) {
        box.style.display = 'none';
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.style.display = 'block';
    }

    function handleBadgeQrFallback(imgEl) {
      if (!imgEl || !imgEl.isConnected) return;
      if (window.__genericBadgeQr && imgEl.src !== window.__genericBadgeQr) {
        imgEl.onerror = null;
        imgEl.src = window.__genericBadgeQr;
        showBadgeWarning('Uyarı: İsme özel QR servisine ulaşılamadığı için bazı kartlarda genel kafile QR kodu kullanıldı (hacı girişte adını kendisi yazabilir).');
        return;
      }
      if (!imgEl.dataset.retriedGenericImg) {
        imgEl.dataset.retriedGenericImg = '1';
        const fallbackCode = (document.getElementById('tourCodePicker')?.value || 'RY-KASIM').trim().toUpperCase();
        const fallbackRoom = (document.getElementById('badgeRoomPicker')?.value || initialBadgeRoom || 'genel').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'genel';
        const fallbackOrigin = String((window.location && (window.location.hostname || window.location.host)) || '').split(':')[0].endsWith('.vercel.app')
          ? 'https://ses.ridvanyilmazturizm.com'
          : '';
        imgEl.src = `${fallbackOrigin}/api/qr-img?code=${encodeURIComponent(fallbackCode)}&room=${encodeURIComponent(fallbackRoom)}`;
        return;
      }
      imgEl.onerror = null;
      showBadgeWarning('Uyarı: İnternet bağlantısı kurulamadı, QR kod görselleri yüklenemedi. Yazdırmadan önce bağlantınızı kontrol edin.');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function syncBadgeRoomOptions(tourObj, preferredRoom) {
      const picker = document.getElementById('badgeRoomPicker');
      if (!picker) return;
      const prev = String(preferredRoom || picker.value || initialBadgeRoom || 'genel').trim().toLowerCase();
      const defaultRooms = [
        { id: 'genel', name: 'Genel Rehberlik Odası' },
        { id: 'siyer', name: 'Siyer / Tavaf Özel Odası' }
      ];
      const baseRooms = Array.isArray(tourObj?.rooms) && tourObj.rooms.length > 0 ? tourObj.rooms : [];
      const seen = new Set();
      const allRooms = [];
      for (const r of [...defaultRooms, ...baseRooms]) {
        const rawId = typeof r === 'string' ? r : (r && r.id) || '';
        const cleanId = String(rawId).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
        if (!cleanId || seen.has(cleanId)) continue;
        seen.add(cleanId);
        const customName = typeof r === 'object' && r && r.name ? String(r.name).trim() : '';
        const label =
          cleanId === 'genel'
            ? 'Genel Rehberlik Odası'
            : cleanId === 'siyer'
            ? 'Siyer / Tavaf Özel Odası'
            : customName || `Özel Oda (${cleanId})`;
        allRooms.push({ id: cleanId, label });
      }
      picker.innerHTML = allRooms
        .map((rm) => `<option value="${escapeHtml(rm.id)}">${escapeHtml(rm.label)}</option>`)
        .join('');
      picker.value = allRooms.some((rm) => rm.id === prev) ? prev : 'genel';
    }

    function onBadgeTourChange() {
      const selCode = document.getElementById('tourCodePicker')?.value || 'RY-KASIM';
      const matched = toursData.find((t) => t.code === selCode);
      syncBadgeRoomOptions(matched);
      updateBadges();
    }

    async function init() {
      try {
        const res = await fetch('/api/bootstrap');
        const data = await res.json();
        if (data && data.authenticated === false) {
          localStorage.removeItem('ry_auth_token');
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          const secureFlag = window.location.protocol === 'https:' ? '; Secure' : '';
          document.cookie = 'ry_auth=; path=/; max-age=0; SameSite=Lax' + secureFlag;
          window.location.replace('/login?next=' + encodeURIComponent(window.location.pathname + window.location.search));
          return;
        }
        if (data && data.agency && data.agency.phone) {
          agencyPhone = data.agency.phone;
        }
        toursData = data.tours || [];
        if (toursData.length > 0) {
          const sel = document.getElementById('tourCodePicker');
          const current = sel.value;
          sel.innerHTML = toursData.map((t) => `<option value="${escapeHtml(t.code)}">${escapeHtml(t.code)} (${escapeHtml(t.name)} • ${escapeHtml(t.guideName)})</option>`).join('');
          if (toursData.some((t) => t.code === current)) sel.value = current;
          const matched = toursData.find((t) => t.code === sel.value) || toursData[0];
          syncBadgeRoomOptions(matched, document.getElementById('badgeRoomPicker')?.value || initialBadgeRoom);
        }
      } catch (e) {
        bootstrapFailed = true;
      }
      updateBadges();
    }

    function toggleBulkListPanel() {
      const p = document.getElementById('bulkListPanel');
      if (!p) return;
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function clearBulkList() {
      const ta = document.getElementById('bulkPilgrimsTextarea');
      if (ta) ta.value = '';
      updateBadges();
    }

    let badgeDebounceTimer = null;
    let renderSeq = 0;

    function debouncedUpdateBadges() {
      if (badgeDebounceTimer) clearTimeout(badgeDebounceTimer);
      badgeDebounceTimer = setTimeout(() => {
        badgeDebounceTimer = null;
        updateBadges();
      }, 300);
    }

    async function printBadgesNow() {
      if (badgeDebounceTimer) {
        clearTimeout(badgeDebounceTimer);
        badgeDebounceTimer = null;
        await updateBadges();
      }
      window.print();
    }

    async function updateBadges() {
      const currentSeq = ++renderSeq;
      const code = document.getElementById('tourCodePicker').value;
      const badgeRoom = (document.getElementById('badgeRoomPicker')?.value || initialBadgeRoom || 'genel').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'genel';
      const customName = document.getElementById('customPilgrimInput').value.trim();
      const bulkRaw = (document.getElementById('bulkPilgrimsTextarea')?.value || '').trim();
      const matchedTour = toursData.find((t) => t.code === code);
      const tour = matchedTour || {
        code,
        name: '13-14 Kasım Umresi',
        guideName: 'Ömer Ali Gültekin',
        makkahHotel: 'Mekke Otel Kudi Tower',
        madinahHotel: '2 Gün Medine Konaklama (Merkezi Bölge)'
      };
      if (bootstrapFailed && !matchedTour) {
        showBadgeWarning('Uyarı: Sunucudan güncel kafile bilgileri alınamadı; varsayılan şablon gösteriliyor. Yazdırmadan önce sayfayı yenileyin.');
      } else {
        showBadgeWarning('');
      }

      let qrJson = { dataUrl: '' };
      try {
        const qrRes = await fetch(`/api/qr?code=${encodeURIComponent(code)}&room=${encodeURIComponent(badgeRoom)}`);
        if (qrRes.ok) qrJson = await qrRes.json();
      } catch (e) {}
      if (currentSeq !== renderSeq) return;
      window.__genericBadgeQr = qrJson.dataUrl || '';

      let samplePilgrims = [];
      if (bulkRaw) {
        samplePilgrims = bulkRaw
          .split(/\r?\n/)
          .map((line) => line.replace(/^\s*\d+[\.\)\-\s]+/, '').trim())
          .filter(Boolean)
          .map((pName) => ({ label: pName, qrName: pName }));
      } else if (customName) {
        samplePilgrims = [{ label: customName, qrName: customName }];
      } else {
        const defaultCount = Math.min(200, Math.max(1, Number(tour.registeredCount) || 4));
        samplePilgrims = Array.from({ length: defaultCount }, (_, idx) => ({
          label: `Umre Misafiri #${idx + 1}`,
          qrName: ''
        }));
      }

      const countLbl = document.getElementById('badgeCountLabel');
      if (countLbl) countLbl.textContent = samplePilgrims.length;

      const qrImgOrigin = String((window.location && (window.location.hostname || window.location.host)) || '').split(':')[0].endsWith('.vercel.app')
        ? 'https://ses.ridvanyilmazturizm.com'
        : '';
      const container = document.getElementById('badgesContainer');
      container.innerHTML = samplePilgrims.map((entry) => {
        const pName = entry.label;
        const qrName = entry.qrName;
        const qrSrc = qrName
          ? `${qrImgOrigin}/api/qr-img?code=${encodeURIComponent(tour.code)}&room=${encodeURIComponent(badgeRoom)}&name=${encodeURIComponent(qrName)}`
          : (window.__genericBadgeQr || `${qrImgOrigin}/api/qr-img?code=${encodeURIComponent(tour.code)}&room=${encodeURIComponent(badgeRoom)}`);
        return `
        <div class="neck-badge">
          <div class="badge-top">
            <div class="lanyard-slot"></div>
            <div class="badge-brand-kicker" style="font-size:0.72rem; color:#E2C785; font-weight:800; letter-spacing:0.12em;">RIDVAN YILMAZ TURİZM • BURSA</div>
            <div class="badge-tour-title" style="font-family:var(--font-display); font-size:1.15rem; font-weight:700; margin-top:3px; color:#FFFFFF;">${escapeHtml(tour.name)}</div>
          </div>

          <div class="badge-body">
            <div class="badge-role-kicker" style="font-size:0.7rem; color:var(--color-muted); font-weight:800; letter-spacing:0.08em; text-transform:uppercase;">UMRE MİSAFİRİ / HACI</div>
            <div class="badge-pilgrim-name" style="font-family:var(--font-sans); font-size:1.22rem; font-weight:800; color:var(--color-emerald-night); margin:3px 0 8px;">
              ${escapeHtml(pName)}
            </div>

            <span class="badge badge-gold badge-code-pill" style="font-size:0.78rem;">KAFİLE KODU: ${escapeHtml(tour.code)}${badgeRoom !== 'genel' ? ` • ODA: ${escapeHtml(badgeRoom.toUpperCase())}` : ''}</span>

            <div class="qr-box">
              <img src="${qrSrc}" onerror="handleBadgeQrFallback(this)" alt="QR Code ${escapeHtml(tour.code)} - ${escapeHtml(pName)}" />
            </div>

            <div class="badge-qr-desc" style="font-size:0.76rem; color:var(--color-muted); max-width:265px; margin:0 auto 10px; line-height:1.4;">
              <strong>${qrName ? 'İsme Özel QR Rehberlik:' : 'Hızlı QR Rehberlik:'}</strong> Telefon kameranızı QR koda okutarak <strong>${escapeHtml(tour.guideName)}</strong> canlı anlatımına doğrudan bağlanın.
            </div>

            <div class="badge-meta-box" style="background:var(--color-ground); border:1px solid var(--color-hairline); border-radius:12px; padding:9px 12px; font-size:0.75rem; text-align:left; display:flex; flex-direction:column; gap:3px; color:var(--color-ink);">
              <div><strong>Kafile Rehberi:</strong> ${escapeHtml(tour.guideName)}</div>
              <div><strong>Mekke Otel:</strong> ${escapeHtml(tour.makkahHotel)}</div>
              <div><strong>Medine Otel:</strong> ${escapeHtml(tour.madinahHotel)}</div>
