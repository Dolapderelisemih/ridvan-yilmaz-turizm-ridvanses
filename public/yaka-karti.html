<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icons/icon-512.png?v=16" />
  <title>Baskıya Hazır Hacı Yaka Kartı & QR Kod | Rıdvan Yılmaz Turizm</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://ses.ridvanyilmazturizm.com/yaka-karti" />
  <link rel="stylesheet" href="/css/style.css?v=16" />
  <style>
    .print-toolbar {
      background: linear-gradient(155deg, #06231B 0%, #093529 100%);
      color: #FFFFFF;
      padding: 16px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--color-gold);
    }
    .badges-sheet {
      max-width: 920px;
      margin: 28px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .neck-badge {
      background: #FFFFFF;
      border: 2px solid var(--color-emerald-deep);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
      position: relative;
    }
    .badge-top {
      background: linear-gradient(150deg, #06231B 0%, #0B4636 100%);
      color: #FFFFFF;
      padding: 20px 22px 18px;
      text-align: center;
      border-bottom: 3px solid var(--color-gold);
      position: relative;
    }
    .lanyard-slot {
      width: 58px;
      height: 10px;
      border-radius: 99px;
      background: var(--color-ground);
      border: 1.5px solid var(--color-gold);
      margin: 0 auto 12px;
    }
    .badge-body {
      padding: 22px;
      text-align: center;
    }
    .qr-box {
      width: 172px;
      height: 172px;
      margin: 14px auto;
      padding: 10px;
      border: 1.5px solid rgba(197, 160, 89, 0.55);
      border-radius: 18px;
      background: #FFFFFF;
      box-shadow: 0 8px 22px rgba(6, 35, 27, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .badge-footer {
      background: var(--color-ground);
      border-top: 1px solid var(--color-hairline);
      padding: 12px 16px;
      font-size: 0.76rem;
      letter-spacing: 0.03em;
      text-align: center;
      color: var(--color-emerald-night);
      font-weight: 800;
    }
    @media print {
      .print-toolbar {
        display: none !important;
      }
      body {
        background: #FFFFFF !important;
      }
      .badges-sheet {
        margin: 0;
        max-width: 100%;
      }
    }
    @media (max-width: 720px) {
      .badges-sheet {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="star-field">

  <div class="print-toolbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <h1 style="font-size:1rem; margin:0; font-weight:800; color:#FFFFFF; font-family:var(--font-sans);">
        Rıdvan Yılmaz Turizm — Hacı Yaka Kartı & Canlı Ses QR Kod Üretici
      </h1>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <select id="tourCodePicker" class="select" style="width:auto; padding:8px 12px; font-size:0.85rem;" onchange="updateBadges()">
        <option value="RY-KASIM">RY-KASIM (13-14 Kasım Umresi • Ömer Ali Gültekin)</option>
      </select>
      <input type="text" id="customPilgrimInput" class="input" style="width:210px; padding:8px 12px; font-size:0.85rem;" placeholder="Özel İsim (İsteğe bağlı)" oninput="updateBadges()" />
      <button class="btn btn-gold btn-sm" onclick="window.print()">A4 Yaka Kartlarını Yazdır / PDF Kaydet</button>
      <a href="/panel" class="btn btn-outline btn-sm" style="color:#FFFFFF; border-color:rgba(255,255,255,0.3); background:transparent;">← Panele Dön</a>
    </div>
  </div>

  <div class="badges-sheet" id="badgesContainer"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('code')) {
      const sel = document.getElementById('tourCodePicker');
      const code = params.get('code').toUpperCase();
      if (!Array.from(sel.options).some((o) => o.value === code)) {
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = code;
        sel.appendChild(opt);
      }
      sel.value = code;
    }
    if (params.get('name')) {
      document.getElementById('customPilgrimInput').value = params.get('name');
    }

    let toursData = [];
    async function init() {
      try {
        const res = await fetch('/api/bootstrap');
        const data = await res.json();
        toursData = data.tours || [];
        if (toursData.length > 0) {
          const sel = document.getElementById('tourCodePicker');
          const current = sel.value;
          sel.innerHTML = toursData.map((t) => `<option value="${t.code}">${t.code} (${t.name} • ${t.guideName})</option>`).join('');
          if (toursData.some((t) => t.code === current)) sel.value = current;
        }
      } catch (e) {}
      updateBadges();
    }

    async function updateBadges() {
      const code = document.getElementById('tourCodePicker').value;
      const customName = document.getElementById('customPilgrimInput').value.trim();
      const tour = toursData.find((t) => t.code === code) || {
        code,
        name: '13-14 Kasım Umresi',
        guideName: 'Ömer Ali Gültekin',
        makkahHotel: 'Rayhaan Al Mashaer Hotel',
        madinahHotel: 'Medine Merkezi Ravza Oteli'
      };

      const qrRes = await fetch(`/api/qr?code=${encodeURIComponent(code)}`);
      const qrJson = await qrRes.json();

      const samplePilgrims = customName
        ? [customName, `${customName} (Refakatçi)`, 'Hacı Mustafa Kaya', 'Hacı Hatice Demir']
        : ['Hacı Mustafa Kaya', 'Hacı Fatma Yıldırım', 'Hacı Ahmet Demir', 'Hacı Ayşe Çelik'];

      const container = document.getElementById('badgesContainer');
      container.innerHTML = samplePilgrims.map((pName) => `
        <div class="neck-badge">
          <div class="badge-top">
            <div class="lanyard-slot"></div>
            <div style="font-size:0.72rem; color:#E2C785; font-weight:800; letter-spacing:0.12em;">RIDVAN YILMAZ TURİZM • BURSA</div>
            <div style="font-family:var(--font-display); font-size:1.25rem; font-weight:700; margin-top:4px; color:#FFFFFF;">${tour.name}</div>
          </div>

          <div class="badge-body">
            <div style="font-size:0.72rem; color:var(--color-muted); font-weight:800; letter-spacing:0.08em; text-transform:uppercase;">UMRE MİSAFİRİ / HACI</div>
            <div style="font-family:var(--font-sans); font-size:1.35rem; font-weight:800; color:var(--color-emerald-night); margin:4px 0 10px;">
              ${pName}
            </div>

            <span class="badge badge-gold" style="font-size:0.8rem;">KAFİLE KODU: ${tour.code}</span>

            <div class="qr-box">
              <img src="${qrJson.dataUrl}" alt="QR Code ${tour.code}" />
            </div>

            <div style="font-size:0.79rem; color:var(--color-muted); max-width:265px; margin:0 auto 14px; line-height:1.45;">
              <strong>Canlı Sesli Rehberlik:</strong> Telefon kameranızı QR koda okutarak <strong>${tour.guideName}</strong> canlı anlatımına şifresiz bağlanın.
            </div>

            <div style="background:var(--color-ground); border:1px solid var(--color-hairline); border-radius:12px; padding:11px 14px; font-size:0.78rem; text-align:left; display:flex; flex-direction:column; gap:4px; color:var(--color-ink);">
              <div><strong>Kafile Rehberi:</strong> ${tour.guideName}</div>
              <div><strong>Mekke Otel:</strong> ${tour.makkahHotel}</div>
              <div><strong>Medine Otel:</strong> ${tour.madinahHotel}</div>
            </div>
          </div>

          <div class="badge-footer">
            ACİL / KAYIP İLETİŞİM (WHATSAPP): +90 538 399 96 66
          </div>
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
